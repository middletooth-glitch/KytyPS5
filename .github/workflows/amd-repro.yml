name: Build amd_repro

on:
  workflow_dispatch:
  push:
    branches: [ amd-repro ]

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Get Vulkan headers
        run: git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git vkh
      - name: Build
        shell: cmd
        run: |
          mkdir out
          cl /nologo /O2 /EHsc /std:c++17 /W3 /Ivkh\include tools\amd_repro\amd_repro.cpp /Feout\amd_repro.exe
      - uses: actions/upload-artifact@v4
        with:
          name: amd_repro
          path: out/amd_repro.exe
